    <!-- Google Tag Manager - Initialize dataLayer early so pushes before GTM loads are queued.
         __GTM_WEB_CONTAINER_ID__ is replaced per-request from settings.yml
         (optimization.tagmanager.web_container_id). Deferred inject reuses window.__GTM_CONTAINER_ID__. -->
    <script>
      window.__GTM_CONTAINER_ID__ = "__GTM_WEB_CONTAINER_ID__";
      window.dataLayer = window.dataLayer || [];
    </script>

    <!-- Page boot config, replaced per request by server/ads/ads-first.ts (applyPageBoot):
         af = ads-first page, cm = visitor consent mode (ads-first only), fp = site counts its own visits, t = page token. -->
    <script>
      window.__4G_PAGE__ = {"af":0,"cm":null,"fp":0,"t":""};
    </script>

    <!-- Google Consent Mode v2 (advanced): everything denied until the visitor's
         choice in the 4g_consent cookie (set by POST /api/consent) says otherwise.
         Must run before GTM loads. See docs/cookies.md. -->
    <script>
      (function () {
        window.gtag =
          window.gtag ||
          function () {
            window.dataLayer.push(arguments);
          };
        var denied = {
          ad_storage: "denied",
          analytics_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
        };
        window.gtag("consent", "default", Object.assign({ wait_for_update: 500 }, denied));
        window.gtag("set", "ads_data_redaction", true);
        var state = { decision: null, mode: null, granted: false };
        try {
          var m = document.cookie.match(/(?:^|;\s*)4g_consent=([^;]+)/);
          var parts = m ? decodeURIComponent(m[1]).split(".") : [];
          if (parts.length === 4 && parts[0] === "v1") {
            state.decision = parts[1];
            state.mode = parts[2];
            state.granted = parts[1] === "granted_explicit" || parts[1] === "granted_implied";
          }
        } catch (e) {}
        // Ads-first page in a notice country with no stored choice: consent counts on landing.
        // cm is only set when the server already knew the country; otherwise ConsentBanner
        // grants after its country lookup. Either way it is stored as granted_implied.
        var page = window.__4G_PAGE__ || {};
        if (!state.decision && page.af === 1 && page.cm === "notice") {
          state.granted = true;
          state.landingImplied = true;
        }
        window.__4G_CONSENT__ = state;
        if (state.granted) {
          window.gtag("consent", "update", {
            ad_storage: "granted",
            analytics_storage: "granted",
            ad_user_data: "granted",
            ad_personalization: "granted",
          });
        }
        window.dataLayer.push({
          event: "consent_state",
          consent_state: state.granted ? "granted" : state.decision === "denied" ? "denied" : "unset",
        });
      })();
    </script>

    <!-- Preconnect to Google Cloud Storage to warm connection before hero images are fetched -->
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />

    <!-- Google Tag Manager — load on first interaction (or 15s fallback).
         dataLayer pushes before load are queued and replayed. The fallback sits
         past Lighthouse's trace window (~10-12s) so GTM never counts against
         TBT, while bounced no-interaction sessions still get tracked.
         Exception: ads-first pages and URLs with an ad click id load GTM on page load. -->
    <script>
      (function () {
        var loaded = false;
        function injectGTM() {
          if (loaded) return;
          loaded = true;
          var containerId = window.__GTM_CONTAINER_ID__;
          if (!containerId) return;
          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != "dataLayer" ? "&l=" + l : "";
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, "script", "dataLayer", containerId);
        }
        // Schedule off the input event to avoid INP regressions.
        function scheduleGTM() {
          if (loaded) return;
          if ("requestIdleCallback" in window) {
            requestIdleCallback(injectGTM, { timeout: 2000 });
          } else {
            setTimeout(injectGTM, 0);
          }
        }
        // Ads-first pages and visits from an ad click load on page load, not on interaction.
        var bootPage = window.__4G_PAGE__ || {};
        if (bootPage.af === 1 || /[?&](gclid|fbclid|gbraid|wbraid)=/.test(window.location.search)) {
          if (document.readyState === "complete") scheduleGTM();
          else window.addEventListener("load", scheduleGTM, { once: true });
          return;
        }
        var events = ["pointerdown", "keydown", "scroll", "touchstart"];
        function onInteract() {
          for (var i = 0; i < events.length; i++) {
            window.removeEventListener(events[i], onInteract, true);
          }
          scheduleGTM();
        }
        for (var i = 0; i < events.length; i++) {
          window.addEventListener(events[i], onInteract, {
            once: true,
            capture: true,
            passive: true,
          });
        }
        // Bounce-with-no-interaction fallback (~1–3% of sessions). Kept past
        // Lighthouse's observation window so GTM stays out of the trace.
        setTimeout(scheduleGTM, 15000);
      })();
    </script>
