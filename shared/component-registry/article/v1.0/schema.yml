name: Article
version: "1.0"
component: Article
file: client/src/components/article/variants/ArticleDefault.tsx
description: Renders formatted markdown content with an optional auto-generated table of contents (top or sticky side)
when_to_use: |
  Use for long-form content pages such as blog posts, documentation, terms of service,
  privacy policies, or any rich text content that benefits from structured headings
  and optional navigation via a table of contents.

  IMPORTANT — splitting an article around a mid-page CTA (or any other section):
  Prefer two (or more) `article` sections on the same page rather than one giant block.
  2+ articles ALWAYS continue one piece (no share choice). Put the lead article first.
  Set `show_toc: true` (and usually `toc_position: side`) on the first article only —
  that controls the shared TOC. Reading time and meta appear only on the first (combined
  bodies); mobile/top TOC only on the first; desktop side TOC may still appear on later
  parts. `toc_group` is optional/legacy, not a decision knob. See example
  `article_split_toc_group`.
behaviors:
  schema_org:
    handler: article
    notes: >-
      Contributes Article or BlogPosting JSON-LD during SSR from article body sections (unified across multiple article
      sections on the page).
props:
  variant:
    type: string
    required: false
    options:
      - default
  content:
    type: string
    required: true
    description: Markdown content for the article body
    example: |-
      # Welcome

      This is an example article with **bold** and *italic* text.
  show_toc:
    type: boolean
    required: false
    description: >
      Whether to show the auto-generated table of contents (based on h1, h2, h3 headings). On pages with 2+ articles,
      only the first article's show_toc controls the shared TOC; later values are non-effects.
  toc_position:
    type: string
    required: false
    options:
      - top
      - side
    description: >
      Position of the table of contents. "top" renders the TOC above the article content. "side" renders the TOC as a
      sticky sidebar that follows the user's scroll position and highlights the active heading. On split pages,
      mobile/top TOC renders only on the first article; desktop side TOC may still appear on later parts.
  toc_group:
    type: string
    required: false
    description: |
      Legacy/internal id for heading stability. Not a share decision — 2+ articles on a page always continue one piece.
  show_reading_time:
    type: boolean
    required: false
    description: >
      Show estimated reading time on the first article (default true). On split pages, minutes combine all article
      bodies; later articles never show meta/reading time.
  show_authors:
    type: boolean
    required: false
  show_updated_at:
    type: boolean
    required: false
  tags:
    type: array
    required: false
    items:
      type:
        type: string
        required: true
    description: Optional tag chips in the article meta row
  category:
    type: string
    required: false
    description: Optional category chip in the article meta row
  category_url:
    type: string
    required: false
    description: Optional link for the category chip
  authors:
    type: array
    required: false
    items:
      type:
        type: string
        required: true
    description: >-
      Author byline (hydrated objects or strings). Map explicitly as authors: "{{ entry.authors }}". First entry is
      primary.
  updated_at:
    type: string
    required: false
  section_id:
    type: string
    required: false
    description: Stable section id (also used as heading-id prefix on split pages)
variants:
  default: {}
