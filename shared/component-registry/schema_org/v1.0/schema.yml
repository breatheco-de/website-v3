name: Schema.org
version: "1.0"
component: SchemaOrg
file: client/src/components/schema_org/variants/SchemaOrgDefault.tsx
description: >-
  Edit-mode-only section that emits one schema.org JSON-LD document during SSR (Course, LocalBusiness, WebSite,
  Organization, Person, etc.). Invisible on the public site. Props tab: curated @type picker with live JSON-LD preview;
  edit properties in the Code tab.
when_to_use: |
  Use when a page needs structured data that is not produced by FAQ, Article, or
  Breadcrumb sections. Place Course companions next to course heroes; LocalBusiness
  on every location; Person on author hubs. WebSite/Organization sections are prefilled from site
  schema-org.yml and stay page-local (they do not write back to the site file).
  Multiple schema_org sections are allowed; they always sort to the top of the page.
behaviors:
  schema_org:
    handler: schema_org
    notes: >-
      Emits one JSON-LD document from schema_type + properties. Resolves @organization refs with dual-emit (nested +
      standalone Organization).
layout:
  flow: out
props:
  schema_type:
    type: string
    required: true
    description: >-
      schema.org @type for this document. Props picker includes Person, Organization, WebSite, Course, LocalBusiness,
      ProfilePage, Article, BlogPosting, or Other.
    example: Course
  properties:
    type: string
    required: true
    description: >-
      YAML object of schema.org properties (snake_case keys). Use provider/parent_organization: "@organization" to
      reference the site Organization template. Nested locales: { es: { name: ... } } apply per locale. For page types
      (WebPage, AboutPage, ContactPage, CollectionPage, ProfilePage, ItemPage) and Person, omit url / @id: they are
      filled from the page address. Never build them from a URL pattern; a typed url for another page on this site
      blocks publish/promote.
  section_id:
    type: string
    required: false
    description: Stable section id
  paddingY:
    type: object
    required: false
variants:
  default:
    content_shape:
      image: unused
      icon: unused
      sample_pages: 114
      measured_at: "2026-10-02"
    best_for: >-
      Pages needing structured data for Course, LocalBusiness, Person, Organization, or WebSite that isn't covered by
      Article, FAQ or Breadcrumb sections.
    avoid_when: Any public-facing page section that requires visible content, images, icons, or media on the rendered page.
    metadata_status: draft
