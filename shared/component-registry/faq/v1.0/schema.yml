name: FAQ Section
version: "1.0"
component: FAQSection
file: client/src/components/FAQSection.tsx
description: Collapsible accordion with frequently asked questions
when_to_use: |
  Use to address common objections and questions.
  Helps with SEO and reduces support inquiries.
behaviors:
  schema_org:
    handler: faq
    notes: Contributes FAQPage JSON-LD during SSR via server/schema-components.
  listing:
    source: dynamic_entries
    notes: >-
      FAQ is a listing over frequently_asked_questions (or content_type). Author via dynamic_entries; items are
      runtime-resolved.
props:
  title:
    type: string
    required: true
    example: Frequently Asked Questions
  items:
    type: array
    required: false
    items:
      question:
        type: string
        required: true
        example: Do I need prior coding experience?
      answer:
        type: string
        required: true
        example: No prior experience is required. We start from the fundamentals.
    description: >-
      Runtime-resolved Q&A pairs from dynamic_entries (not authored). Prefer dynamic_entries / hardcoded_entries for
      authoring.
  dynamic_entries:
    type: object
    required: false
    properties:
      content_type:
        type: string
        required: false
      database:
        type: string
        required: false
        example: frequently_asked_questions
      limit:
        type: number
        required: false
        example: 9
      sort:
        type: string
        required: false
        example: priority
      search:
        type: string
        required: false
      item_template:
        type: object
        required: false
      hardcoded_entries:
        type: array
        required: false
        items:
          question:
            type: string
            required: true
          answer:
            type: string
            required: true
      permanent_filters:
        type: array
        required: false
        items:
          item_property_slug:
            type: string
            required: true
          value:
            type: string
            required: true
      user_filters:
        type: array
        required: false
        items:
          item_property_slug:
            type: string
            required: true
          component_renderer:
            type: string
            required: true
            options:
              - text-input
              - dropdown
              - tags
          default_value:
            type: string
            required: false
          all_label:
            type: string
            required: false
          split_comma_values:
            type: boolean
            required: false
            description: >
              Server-injected when the field editor enables CSV splitting (source of truth is
              Treat comma-separated strings as multiple values on the CT/DB field).
      ignored_entries:
        type: array
        required: false
        items:
          type:
            type: string
            required: true
        description: Keys to exclude. Prefer slug/id when present; otherwise faqItemKey(question).
    description: >-
      Listing query for FAQ items. Typical database: frequently_asked_questions. On location (or program) pages, filter
      with permanent_filters and value "{{ single.slug }}" so the same bound section works across entries.
  hardcoded_entries:
    type: array
    required: false
    items:
      question:
        type: string
        required: true
      answer:
        type: string
        required: true
    description: >-
      Authored Q&A pairs used when there is no dynamic database/content_type, or merged ahead of dynamic results (also
      allowed under dynamic_entries).
  item_overrides:
    type: object
    required: false
    description: >-
      Per-item presentation overrides after listing resolve (e.g. hideOnLocations). Applied to both the accordion and
      FAQPage JSON-LD.
  cta:
    type: object
    required: false
    properties:
      text:
        type: string
        required: false
        example: Still have questions?
      button:
        type: object
        required: false
        properties:
          label:
            type: string
            required: true
            example: Talk to an Advisor
          url:
            type: string
            required: true
            example: /contact
    description: Optional call-to-action section below the FAQ accordion. Only shown if at least text or button is provided.
