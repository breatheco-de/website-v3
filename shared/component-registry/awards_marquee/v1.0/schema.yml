name: Awards Marquee Section
version: "1.0"
component: AwardsMarquee
file: client/src/components/AwardsMarquee.tsx
description: >-
  Displays a continuously scrolling horizontal band of award logos using react-fast-marquee. Ideal for showcasing
  multiple awards and certifications.
when_to_use: |
  Use when you have many award logos (5+) that would clutter a static grid. The continuous
  scroll creates visual movement and fits a large number of badges in a small vertical footprint.
  Best placed below the hero section or credibility strip as a secondary trust layer.
behaviors:
  listing:
    source: dynamic_entries
    notes: >-
      Optional. Without dynamic_entries, authored items[] render as today. With database/content_type,
      resolve fills items (item_template + hardcoded_entries).
image_sizes:
  default.items[].logo: "(min-width: 768px) 220px, 80px"
props:
  speed:
    type: number
    required: false
    description: Scroll speed in pixels per second (default 40)
  gradient:
    type: boolean
    required: false
    description: Whether to show fade gradient at edges (default true)
  gradientColor:
    type: string
    required: false
  gradientWidth:
    type: number
    required: false
    description: Width of fade gradient in pixels (default 100)
  title:
    type: string
    required: false
  title_above_carousel:
    type: boolean
    required: false
  items:
    type: array
    required: false
    items:
      id:
        type: string
        required: true
      alt:
        type: string
        required: true
      logo:
        type: string
        required: false
      logoHeight:
        type: string
        required: false
      source:
        type: string
        required: false
      name:
        type: string
        required: false
      year:
        type: string
        required: false
    description: >-
      Logo row. Author statically, or leave for resolveDynamicEntries when using dynamic_entries.
  dynamic_entries:
    type: object
    required: false
    properties:
      database:
        type: string
        required: false
      content_type:
        type: string
        required: false
      limit:
        type: number
        required: false
      sort:
        type: string
        required: false
      item_template:
        type: object
        required: false
      hardcoded_entries:
        type: array
        required: false
        items:
          type:
            type: string
            required: true
      permanent_filters:
        type: array
        required: false
        items:
          item_property_slug:
            type: string
            required: true
          value:
            type: string
            required: true
    description: Optional listing source (database / content type)
  _dynamic_meta:
    type: object
    required: false
    properties:
      content_type:
        type: string
        required: false
      total:
        type: number
        required: false
      locale:
        type: string
        required: false
variants:
  default:
    description: Continuously scrolling horizontal logo band
    best_for: Award / technology / partner logos under hero or credibility strip
