  - date: "2026-10-22"
    summary: "agent_session ids are server-issued: start ignores a passed id; invented ids (new, pending, placeholder…) are refused"
    agent_impact:
      - "agent_session start: omit agent_session_id. The server always returns a new UUID; an id you pass is ignored with warning start_ignores_agent_session_id. Name a batch of work with label on start, not with a custom id."
      - "Every mutate, note and summarize refuses an agent_session_id that start did not issue (session_unknown, next_action agent_session start). Ids like new / pending / start / placeholder were shared by several agents, mixing their staff trails; resume and session_conflict never return them."
      - "attach_variant on an old proposal filed under an invented id works from any session of the same proposer (username + role); proposals filed under a real session id still need that same session."
    tools_changed: false
    paths:
      - shared/agent-identity.ts
