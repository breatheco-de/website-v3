      - mcp-server/agent-conventions.md
  - date: "2026-10-22"
    summary: "Proposal drafts: system writes no longer make a co-author; revise_entries restarts the draft again; no phantom remove op for nested nulls"
    agent_impact:
      - "Draft rewrites by migrations, sweeps, sync pulls or with no author (co_authors username unknown / migration:* / system:*) only record the new draft fingerprint: no co-author, no claim release, no back-to-review. revise_entries now restarts a draft the proposal created from today's live unless a person co-authored it, so stray page-level ops (funnel, published_at, authors) left in old drafts disappear on the next revise."
      - "Proposals stuck on server-added funnel / published_at / meta.* ops or on context_stale reason draft_changed after the 2026-10-22 field-scope migration: the author runs revise_entries with only the ops they intend, then re-checks list_proposals(proposal_id) ops before asking for re-review."
      - "Proposal ops no longer list a remove for a nested null that live also has (e.g. seo.pillar_path: null, the cluster opt-out). Publish keeps that null, so blockers filed only about that op can be resolved."
    tools_changed: false
    paths:
      - server/content-proposals/service.ts
      - server/versioning/draft-base.ts
      - server/routes/components.ts
  - date: "2026-10-22"
    summary: "list_variants reports variant files versioning.yml is missing; versioning.yml now commits with the variant file"
    agent_impact:
      - "list_variants adds unregistered_variants [{ locale, slug, fileName }] (live-only and versioned payloads) plus warning unregistered_variant_files with the relative paths. Those files get no traffic and cannot be promoted or allocated until listed; staff register them at 0% (Versions panel → Add to versions, or validation fixer register-unlisted-variants). Live content does not change. create_variant with the same slug still 409s."
      - "Since 2026-08-25 most versioning.yml changes (create_variant, traffic, delete, promote) stayed unpushed in production: they were queued under an author with no GitHub connection. They are now queued under the person who made the change, in the same commit as the variant file; already-stuck changes push on the next sync."
      - "Validator draft-integrity adds warning UNREGISTERED_VARIANT_FILE (fix register-unlisted-variants)."
    tools_changed: false
    paths:
      - mcp-server/tools/pages.ts
      - server/routes/versioning.ts
      - server/draft-entry.ts
      - server/versioning/VersioningManager.ts
      - server/auto-commit.ts
      - scripts/validation/validators/draft-integrity.ts
      - scripts/validation/fixers/draft-integrity.ts
  - date: "2026-10-22"
    summary: "Every lead form needs one mandatory consent checkbox; publish refuses consent_no_mandatory_checkbox"
    agent_impact:
      - "Rule: General and Marketing are mandatory whenever shown (both → both, validator warning FORM_TWO_REQUIRED_CONSENTS); a custom consent only when neither is shown; otherwise the site Default (consent.fallback) appears as the mandatory one. SMS, Email and WhatsApp never count. explain_site topic lead-forms → Consent checkboxes."
      - "publish_draft / promote_variant / staff publish / live replace_all_sections refuse consent_no_mandatory_checkbox (action_required add_mandatory_consent) when a form or a conversion_name-switching form_override has no mandatory checkbox; next_action update_fields sets <form>.consent.general true on the draft. A site without a Default adds warning site_no_default_consent; validator codes FORM_NO_REQUIRED_CONSENT and SITE_NO_DEFAULT_CONSENT are errors."
      - "sms_usa_only now decides US visitors by country_code (picked location, else detected location, else visitor geo for XX/remote). CRM consent values unchanged."
