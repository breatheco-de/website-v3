# MCP agent changelog — last 6 days are served by bootstrap_agent.
# Append when changing MCP tools, explain docs, envelopes, conventions, or agent-facing contracts.
# See .cursor/rules/mcp-server-responses.mdc

window_days: 6

entries:
  - date: "2026-09-02"
    summary: "delete_variant MCP tool — discard drafts without promoting"
    agent_impact:
      - "New delete_variant: confirm:true + report (min 80). Deletes {variantSlug}.{locale}.yml; live unchanged unless last draft on unpublished entry (entryDeleted)."
      - "VARIANT_HAS_TRAFFIC when allocation > 0 — staff must remove traffic in Versioning first. Template deletes need confirm_template_delete:true. cleanup_orphan:true strips versioning rows when the file is already gone."
      - "Reconnect MCP after deploy so tools/list includes delete_variant."
    paths:
      - mcp-server/tools/pages.ts
      - server/routes/versioning.ts
      - server/versioning/delete-variant.ts
      - shared/mcp-tool-catalog.ts
    tools_changed: true
  - date: "2026-09-01"
    summary: "Structural section tools accept report + agent_session_id"
    agent_impact:
      - "add_section, remove_section, reorder_sections, replace_entry_sections now declare report (min 80) and agent_session_id — same as update_fields."
      - "Missing/short report returns action_required: report_required before the edit-sections API call (not a misleading server error)."
      - "Reconnect MCP after deploy so tools/list picks up the new parameters."
    paths:
      - mcp-server/lib/page-tool-helpers.ts
      - mcp-server/tools/pages.ts
    tools_changed: true
  - date: "2026-09-01"
    summary: "Scoped entry/site pipeline events — legacy coarse write types removed"
    agent_impact:
      - "Writes emit entry_locale_saved (with parts), entry_common_saved, entry_seo_changed, site_redirects_changed, registry_file_saved, site_bulk_synced; deletes emit entry_deleted."
      - "Wait for validation_results_ready after entry_locale_saved (live) and seo_index_ready after entry_seo_changed (unless seoIndexSynced on payload)."
      - "Promote/unpublish emit entry_locale_promoted / entry_locale_unpublished. MCP writes use markFileAsModified only — same event path as staff UI."
      - "Legacy SQLite rows (content_file_written, etc.) may still appear in pipeline UI with old headlines; new code never emits them."
    paths:
      - server/events/types.ts
      - server/events/emit-entry-events.ts
      - server/events/dispatcher.ts
      - server/jobs/definitions/seo-index-refresh.ts
      - mcp-server/lib/content-write-notify.ts
    tools_changed: false
  - date: "2026-09-01"
    summary: "locale-slug-uniqueness validator — SLUG_SHARED_ACROSS_LOCALES warning"
    agent_impact:
      - "run_entry_diagnostics and on-save validation warn when two or more locales of the same YAML entry share the same effective public URL slug (locale YAML slug or folder fallback)."
      - "Applies to non-database content types with per-locale url_pattern (en + es); skips default-only patterns (e.g. landing) and database-backed types."
      - "Fix: set a different slug on each locale file, or translate_entry with url_slug. Folder name stays entry identity."
    paths:
      - scripts/validation/validators/locale-slug-uniqueness.ts
      - scripts/validation/shared/runClass.ts
    tools_changed: false
  - date: "2026-09-01"
    summary: "SEO cluster in-body links — advisory only; HTML href detection in diagnostics"
    agent_impact:
      - "Missing hub/member in-body links (HUB_MISSING_MEMBER_LINKS, MEMBER_MISSING_HUB_LINK) no longer block publish_draft or promote_variant."
      - "seo-cluster-links validator reports those codes as warnings via run_entry_diagnostics (SEO category), same severity as ORPHAN_PAGE."
      - "Diagnostics path collection now parses HTML <a href> in blog content fields — not only markdown ](/path) and url-shaped YAML keys."
    paths:
      - server/live-entry-seo-gate.ts
      - scripts/validation/validators/seo-cluster-links.ts
      - server/cluster-hub-links.ts
      - mcp-server/explain/content_system.md
    tools_changed: false
  - date: "2026-08-31"
    summary: "get_product_funnel_analytics — per-page conversions + ecommerce intent (drop CTAs)"
    agent_impact:
      - "Per-page metrics are sessions/views plus path-scoped lead conversions and ecommerce intent (same event set on every stage). cta_clicks removed."
      - "Lead events: student_application, request_more_info. Ecommerce intent: view_item, add_to_cart, view_item_list, select_item, click_begin_checkout — filtered by product identity on the page path."
      - "Product-wide conversions/ecommerce_intent KPIs unchanged. Stage placement does not filter which action events count."
    paths:
      - mcp-server/tools/ecommerce.ts
      - server/ecommerce/journey-analytics.ts
      - client/src/pages/StoreProductDetailPage.tsx
    tools_changed: false
  - date: "2026-08-31"
    summary: "get_product_funnel_analytics — Page performance from GA4 BigQuery"
    agent_impact:
      - "New read tool get_product_funnel_analytics(slug, mode?, days?, site?) — per-page sessions/views/CTAs, stage distinct sessions, product item_id KPIs. Does not imply stage-to-stage flow."
      - "mode=stage_flow returns not_implemented; use page_performance. Configure tracking.bigquery via staff /private/tracking/bigquery."
      - "Conversions dual-write item_id when ecommerce_product_field + funnel resolve succeeds — prefer item_id over program for product KPIs."
    paths:
      - mcp-server/tools/ecommerce.ts
      - shared/mcp-tool-catalog.ts
      - mcp-server/explain/ecommerce.md
      - mcp-server/explain/lead-forms.md
    tools_changed: true
  - date: "2026-08-31"
    summary: "Per-user MCP read/write access overlay (Security → Users)"
    agent_impact:
      - "get_current_user returns mcp_read_enabled and mcp_write_enabled. CMS roles are unchanged; these flags only affect MCP."
      - "When mcp_write_enabled is false, capabilities are view-only (content_view / metrics_view / read_redirects) and mutate tools are absent from allowed_tools — guide/explain only."
      - "When mcp_read_enabled is false, /mcp requests are rejected (403). Reconnect after an admin changes your MCP access."
    paths:
      - mcp-server/tools/user.ts
      - mcp-server/lib/auth.ts
      - server/user-store.ts
    tools_changed: false
  - date: "2026-08-31"
    summary: "bootstrap_agent replaces get_agent_changelog (playbook + conventions + changelog)"
    agent_impact:
      - "Call bootstrap_agent once near the start of an MCP content run (Claude.ai / Grok / connectors). First call: empty args → playbook + skill.content (mcp-server/agent-conventions.md) + 6-day changelog."
      - "Later calls: include_skill_content:false and/or known_skill_version — changelog and playbook still returned; conventions body omitted. Then agent_session start; pass agent_session_id + report on mutates."
      - "get_agent_changelog removed — reconnect/refresh the MCP connector so tools/list updates."
    paths:
      - mcp-server/tools/explain.ts
      - mcp-server/lib/mcp-playbook.ts
      - mcp-server/lib/agent-changelog.ts
      - mcp-server/agent-conventions.md
      - shared/mcp-tool-catalog.ts
    tools_changed: true
  - date: "2026-08-29"
    summary: "Validation cache staleness: verified complete, 1-min on-save debounce, scoped diagnostics without confirm"
    agent_impact:
      - "update_issue complete re-validates the entry (seo-duplicates for DUPLICATE_*); refuses with complete_rejected_still_open + prior_attempts if still failing; returns auto_completed_ids for cleared siblings."
      - "get_entry_content / get_entry_seo include validation_pending when on-save revalidation is still debouncing (1 min after writes)."
      - "run_entry_diagnostics with slugs/urls no longer needs confirm:true; full-site still does. seo-duplicates is cross-entry (not cleared by slug-scoped runs)."
    paths:
      - mcp-server/tools/pages.ts
      - server/services/verifiedCompleteIssue.ts
      - server/services/onSaveValidationScheduler.ts
      - scripts/validation/validators/seo-duplicates.ts
    tools_changed: true
  - date: "2026-08-28"
    summary: "Agent reports must list plain copy values (not JSON dumps)"
    agent_impact:
      - "Mutate / issue / session report params: when you set titles, CTA copy, success messages, etc., list plain values (Title: …; Subtitle: …)."
      - "Do not paste JSON/YAML or only name tools/fields in staff-facing reports."
      - "Reconnect MCP if tool descriptions look stale."
    paths:
      - mcp-server/lib/agent-report.ts
      - mcp-server/tools/pages.ts
      - mcp-server/explain/content_system.md
      - client/src/components/DebugBubble/solveWithAiPrompt.ts
    tools_changed: true
  - date: "2026-08-28"
    summary: "update_issue release requires report; prior_attempts on validation issues"
    agent_impact:
      - "release of an active claim requires report (min 80): what you tried and why stopping. Idempotent if already unclaimed."
      - "get_entry_content / get_entry_seo validation_issues include prior_attempts (who, when, reason released|ttl_expired, reports)."
      - "Read prior_attempts before reclaiming. Reconnect MCP if tool descriptions look stale."
    paths:
      - mcp-server/tools/pages.ts
      - server/services/validationCacheService.ts
      - scripts/validation/shared/types.ts
    tools_changed: true
  - date: "2026-08-28"
    summary: "SEO capabilities split: scoped seo_edit + read/edit_redirects + seo_settings"
    agent_impact:
      - "seo_edit is scoped by content type (page meta only). Custom roles with old seo_edit were expanded to also grant read_redirects, edit_redirects, and seo_settings."
      - "test_redirect → read_redirects; update_redirect → edit_redirects; ensure_content_type_schema_org → seo_settings. SEO listings union content_view + seo_edit scopes."
      - "reset_entry_field removed — use update_fields updates[] with reset:true (no value/meta_target) or update_entry_field reset:true. Reconnect MCP if tools/list looks stale."
    paths:
      - shared/capabilities.ts
      - shared/mcp-tool-catalog.ts
      - server/user-store.ts
      - mcp-server/tools/pages.ts
      - mcp-server/tools/redirects.ts
    tools_changed: true
  - date: "2026-08-28"
    summary: "Fold reset_entry_field into update_fields / update_entry_field"
    agent_impact:
      - "reset_entry_field removed — use update_fields updates[] with reset:true (no value/meta_target) or update_entry_field reset:true."
      - "update_fields may mix set and reset items; reset-only returns after field-reset without set-write."
      - "Refresh/reconnect MCP connector — tool list changed (reset_entry_field gone)."
    paths:
      - mcp-server/tools/pages.ts
    tools_changed: true
  - date: "2026-08-28"
    summary: "Redirect MCP tools use read_redirects / edit_redirects (not seo_edit)"
    agent_impact:
      - "test_redirect requires read_redirects; update_redirect requires edit_redirects (denyResponse matches)."
      - "seo_edit alone no longer reveals redirect tools in tools/list — reconnect if caps look stale."
    paths:
