  - date: "2026-09-25"
    summary: "Content-type fields can be deprecated (retired) with an optional replacement field"
    agent_impact:
      - "editor.<field>.deprecated { replaced_by|null, reason? }: new entries and entries without a stored value cannot set the field → code deprecated_field with deprecated { field, replaced_by, reason, field_path }; next_actions → update_entry_field on replaced_by (empty when null). Old entries (live _common.yml / {locale}.yml already has a value) keep and may edit it. Clearing always allowed; nothing is copied to the replacement."
      - "Covered: update_entry_field, update_fields (locale + _common), create_entry (fails before write), duplicate (strips + stripped_deprecated_fields warning), raw file PUT, promote/publish of drafts. Not blocked: field_mapping defaults, DB column values."
      - "New read fields: get_content_type_info.deprecated_fields + deprecated_fields_note; get_entry_fields catalog rows deprecated / replaced_by / pick_hint and value rows deprecated / deprecated_locked (+ system hint, warning deprecated_field); get_entry_content.deprecated_fields_present (always an array)."
      - "update_fields / add_section / replace_entry_sections warn deprecated_template_ref when a write adds a new {{ entry.X }} / {{ single.X }} ref to a deprecated field (write still saved)."
      - "update_content_type editor accepts deprecated (null restores). Preview warnings deprecated_existing_values_stay + deprecated_template_refs. Rejects deprecated_config_invalid (with required, bad/self/deprecated replacement) and deprecated_replacement_target (remove/deprecate a field another deprecated field points at)."
    tools_changed: true
    paths:
      - shared/deprecatedField.ts
      - server/deprecated-field-guard.ts
      - mcp-server/lib/deprecated-field-mcp.ts
