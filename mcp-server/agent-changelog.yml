    summary: "Each new language picks its own URL slug: locked at idea accept, enforced at filing, checked at go-live"
    agent_impact:
      - "update_proposal accept: accepted_entry.slug is the folder name (page ID in every language). For a new language of a page already live in another language, pass accepted_entry.url_slug (this language's address word, e.g. es que-es-manus-ia) or accept refuses url_slug_required. The address (url_slug, else slug for a brand-new page) must be free in that language (slug_already_owned_by_other_entry) and not look like another language (slug_locale_mismatch; slug_language_ack: true for a name)."
      - "propose_change / revise_entries: the implemented idea's url_slug is seeded into the new draft as slug: (warning idea_url_slug_locked). A different { field_path: \"slug\" } update needs url_slug_override { reason } (min 40; idea_url_slug_conflict). With no locked address, a new language without a slug update (or slug on the kept draft) refuses locale_url_slug_required. update_fields slug on a variant now stages the address on the draft (live renames still go through slug rename)."
      - "Go-live: proposal apply, promote_variant, publish_draft, and staff publish refuse locale_url_slug_required when a new language's draft has no own slug (next_action update_fields slug on the variant). Same word as the folder is allowed (deliberate keep). Publishing a slug that looks like another language warns slug_locale_mismatch."
    tools_changed: false
