      - "New refusals/warnings: sections_required with details.new_locale (new language of an entry page, detached entry, or new template language needs one full translated sections update; next_actions get_entry_content on the source locale + get_component_schema); accepted_entry_needs_layout on accept of a page idea; creates_page_entry (review); template_locales_incomplete (template proposal skips live template languages); template_placeholders_unfilled (apply dry_run + apply: new {{ entry.* }} placeholders some attached entries cannot fill; never blocks); layout_owner_changed (entry reattached while a sections draft is open — review warning, and apply → context_stale reason layout_owner_changed → needs_author)."
      - "Reviewers: entries carry sections_summary (added/removed/changed/moved per section; max 30 rows, 8 keys). New checklists layout_structure (structural change or created layout; registry checks shape only) and template_blast_radius; discovery_path adds optional list_entries (siblings) + get_component_schema. CONVENTIONS_VERSION 35 — re-bootstrap_agent for skill.content."
