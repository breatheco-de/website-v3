# MCP agent changelog — last 6 days are served by bootstrap_agent.
# Append when changing MCP tools, explain docs, envelopes, conventions, or agent-facing contracts.
# See .cursor/rules/mcp-server-responses.mdc

window_days: 6

entries:
  - date: "2026-10-23"
    summary: "Page tests: list_variants warns about A/B readiness, stickiness and split mismatch; the hidden A/B check page is locked; lead page_variant can be default"
    agent_impact:
      - "list_variants adds started_at (per-locale run date) and warnings: ab_testing_not_setup (visitors only see Default until staff finish Settings → A/B testing → Setup), ab_check_failing (running tests continue; starting/raising traffic blocked), variant_assignment_sticky (visitors keep their first version; a new split only affects new visitors; allocation is staff-only), split_mismatch (locale, source, expected vs observed shares, p, through_date: results unreliable)."
      - "The landing/page ab-check entry (system: ab_check) is a locked system page: edits, deletes, renames, variants and traffic return system_page_locked; it is omitted from list_entries and listings. Do not try to edit or recreate it; only staff Setup does."
      - "Lead page_experiment_id is the visit's first test (contentType:slug:locale@YYYY-MM-DD) and page_variant can be default. get_leads_breakdown gains default rows; leads before the fix used a buggy split."
    tools_changed: false
    paths:
      - mcp-server/tools/pages.ts
      - mcp-server/lib/ab-testing-warnings.ts
      - mcp-server/explain/lead-forms.md
      - server/ab-testing/state.ts
      - server/versioning/split-health.ts
  - date: "2026-10-23"
    summary: "Apply dry_run previews while blockers are open; get_entry_fields names the file each YAML value comes from"
    agent_impact:
      - "update_proposal apply dry_run (1.0) no longer fails proposal_blocked: it returns merge_preview + warning preview_while_blocked (details.open_blocker_ids) and a resolve_blocker next_action. Real apply is still proposal_blocked; legacy proposals stay legacy_version; four-eyes still applies. A clean preview is not approval and does not reset the 10/30-day blocked clock."
      - "get_entry_fields YAML-backed rows add stored_in (locale_file | draft_file | page_common | type_template | not_set) + stored_in_path, also_in[] for shadowed copies (locale_file + page_common on a page-level field = legacy copy publish drops), and publishes_to: page_common for page-level fields staged in a draft. entry_default means the page's own YAML value, not a type fallback."
      - "Blocker fix conditions should be checkable from the page files (stored_in / also_in) or the apply dry_run — order: fix → preview → resolve_blocker → four-eyes apply."
    tools_changed: false
    paths:
      - server/content-proposals/service.ts
      - server/field-overrides.ts
      - mcp-server/tools/proposals.ts
      - mcp-server/tools/pages.ts
      - mcp-server/explain/proposals.md
      - mcp-server/explain/reading-proposals.md
  - date: "2026-10-23"
    summary: "add_blocker requires a plain-English staff_summary next to the technical body"
    agent_impact:
      - "update_proposal add_blocker: pass staff_summary (1-4 plain sentences, 40-700 chars: what visitors/Google would see change, what must happen before approving, who does it). Missing → blocker_staff_summary_required; field/file names, snake_case/camelCase/dotted names, backticks, or words like op/schema/slug/locale/YAML → blocker_staff_summary_not_plain with details.problems. Nothing is saved on either; retry with the same body."
      - "body stays the technical version for the author (field paths, codes, files). Staff read staff_summary first; body sits behind a technical-details toggle."
      - "Blockers read via list_proposals carry staff_summary (null on old blockers until staff run migration 007_blocker_staff_summaries). System predecessor_closed blockers include one."
    tools_changed: false
    paths:
      - server/content-proposals/blocker-staff-summary.ts
      - server/content-proposals/service.ts
      - mcp-server/tools/proposals.ts
      - mcp-server/explain/proposals.md
      - mcp-server/explain/reading-proposals.md
  - date: "2026-10-23"
    summary: "Saves that would write a destroyed {{ }} placeholder ({\"[object Object]\": null}) are blocked; nothing is written"
    agent_impact:
      - "Any content write (update_fields, section edits, detach, publish stamps, MCP file writes) fails with errorCode corrupted_template_value when the data carries a \"[object Object]\" key. The message names the file and key paths (e.g. sections.1.updated_at); the file on disk and GitHub is unchanged. Do not retry or work around it: report the file and paths to staff, the dev team must restore the placeholder from git history."
      - "New validator corrupted-template-values (issue code CORRUPTED_TEMPLATE_VALUE, coding_agent_only) lists files that still carry the broken value; MCP agents must not claim it."
    tools_changed: false
    paths:
      - server/content-yaml.ts
      - shared/templateVars.ts
      - scripts/validation/validators/corrupted-template-values.ts
  - date: "2026-10-23"
    summary: "Proposals flag draft fields the author did not send; required-field gate no longer calls text with site tokens empty"
    agent_impact:
      - "list_proposals(proposal_id): entries carry unrequested_fields (draft fields that would publish with no requested op covering them; updated_at excluded) and ops_match_request is false when any exist. Warning draft_has_unrequested_fields + update_proposal revise_entries next_action. Author: revise with only the intended ops (restarts a draft this proposal created from today's live). Reviewer: judge them as ops; unintended → blocker asking the author to revise."
      - "Apply / promote no longer fail seo_gate 'Field content is required ... cannot be empty' when the text uses site tokens such as {{ global.price_ai_engineering | $399 }}. Only a value that is nothing but placeholders (e.g. {{ entry.content }}) counts as empty."
    tools_changed: false
    paths:
      - server/content-proposals/service.ts
      - mcp-server/tools/proposals.ts
      - mcp-server/explain/proposals.md
      - shared/validateRequiredFields.ts
  - date: "2026-10-23"
    summary: "Ideas built around an existing file name its media_id + src; proposal summary and rationale render as Markdown"
    agent_impact:
      - "propose_change kind idea: when the page hands out or is built on an existing file (PDF lead magnet, video, image), put its gallery media_id and public src URL in summary or rationale. Reviewers add_blocker when it is missing (idea-opportunity-harm disposition + author checklist)."
      - "Staff see proposal summary and rationale rendered as Markdown on the proposal page: bare URLs become links, lists and `code` render, single line breaks are kept."
    tools_changed: false
    paths:
      - mcp-server/tools/proposals.ts
      - mcp-server/explain/idea-opportunity-harm-proposals.md
      - mcp-server/explain/proposals.md
      - client/src/components/agents/ProposalMarkdown.tsx
  - date: "2026-10-23"
    summary: "add_blocker body is Markdown: one-line verdict, blank line, numbered list with one item per problem"
    agent_impact:
      - "update_proposal add_blocker body: write a one-sentence verdict, a blank line, then a Markdown numbered list (1. 2. …) with one item per problem, each saying what's wrong, what fixed looks like and why it matters. Wrap field paths, slugs and URLs in backticks; no headings or tables. Min 80 chars is unchanged."
      - "Staff see blocker bodies and resolve notes rendered as Markdown on the proposal page; older bodies written as inline (1) (2) (3) are shown as a list automatically, so do not rewrite existing blockers."
    tools_changed: false
    paths:
