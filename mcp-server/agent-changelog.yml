  - date: "2026-10-22"
    summary: "Hub links at go-live, chained proposals (applies_after_proposal_id), hub split diagnostics + hub_split situation"
    agent_impact:
      - "Ideas: the 'default zero new hub links' rule is gone. Accepted pages get a hub → page link at go-live via a second edits proposal on the hub (internal_links, applies_after_proposal_id = the page's proposal). The page's create (and finished apply, when still missing) returns hub_link_follow_up with a propose_change next_action, or hub_has_open_edits when the hub already has open edits (file after it closes; the page may go live first). Kill criterion must say the hub link is removed if the page is retired."
      - "New edits field applies_after_proposal_id (propose_change arg; update_proposal action set_applies_after, proposer/staff, empty unlinks). Order only: apply refuses predecessor_not_applied until the predecessor is finished (partial does not count); applying the predecessor returns dependents_ready + update_proposal apply next_actions (nothing auto-applied). Refusals: applies_after_cycle | applies_after_closed | applies_after_not_found | applies_after_edits_only. Rejecting/withdrawing/auto-closing a predecessor adds a predecessor_closed blocker to each open dependent. Rows carry applied_before_proposal_ids and dependent_overdue_flagged_at (daily sweep, 48h after the predecessor finished; event proposal_dependent_overdue; never escalates or closes). Attention predecessor_applied sorts first for reviewers and counts in needs_review. Not supersedes_proposal_id."
      - "Hub split: seo-cluster-links adds HUB_THIN_LINK_DENSE (expand, do not split) and HUB_OVERLOADED (lists split ideas in flight); thresholds in seo-config.yml hub_load. Accept refuses idea_seo_target_members_claimed when another accepted, not-yet-live hub idea claims a member. New declared-only review situation hub_split (checklist hub_split) for the original hub rewrite; idea_seo_hub_members_follow_up next_actions now carry applies_after_proposal_id and ask moved members to update their in-body hub link. Playbook: explain_site topic proposals subtopic hub-split."
    tools_changed: false
    paths:
