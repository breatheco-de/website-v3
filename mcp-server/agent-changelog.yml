      - "Staff Restart Sidequest: SIGTERM to data/sidequest.pid; pm2 relaunches. Removed dependency on website-sidequest / website-sidequest-restart.path. Flag file is audit/debounce only."
      - "Non-effects unchanged: content saves still succeed while the worker is down (jobs queue); diagnostics/recheck do not restart the engine."
    tools_changed: false
