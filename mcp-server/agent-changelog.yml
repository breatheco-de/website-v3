  - date: "2026-09-25"
    summary: "SEO validators (meta, seo-depth, seo-duplicates) check the filled-in meta visitors see, not raw {{ }} templates; new *_INHERITED_FROM_COMMON warnings"
    agent_impact:
      - "TITLE_TOO_SHORT/LONG, DESCRIPTION_TOO_*, DUPLICATE_TITLE/DESCRIPTION now measure meta after field-mapped {{ entry.* }} / {{ single.* }} + site vars (default values; entry's own region) — same resolveEntryMeta as the live SEO gate. Values still containing {{ }} skip length/duplicate checks (reported only as UNRESOLVED_META_TEMPLATE). Duplicates stay site-wide across languages; suggestion names each {locale}.yml to translate."
      - "New seo-depth warnings (YAML entries with 2+ live languages): TITLE_INHERITED_FROM_COMMON / DESCRIPTION_INHERITED_FROM_COMMON when meta.page_title / meta.description (or the mapped entry field its {{ entry.X }} reads) exists only in _common.yml; CANONICAL_INHERITED_FROM_COMMON when meta.canonical_url is in _common.yml. suggestion carries the field path + {locale}.yml. Not checked: og_image, redirects, robots, priority, change_frequency."
      - "MISSING_OG_IMAGE also fires when og_image is a variable with no value. META_RESOLVE_FAILED (seo-depth) = meta could not be filled in for that page; its other SEO checks are skipped for that page only."
    tools_changed: false
    paths:
