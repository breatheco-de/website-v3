blog:
  insights_intent: content_seo
  strategy:
    purpose: "SEO/GEO educational posts; topical depth, clusters, and answer quality."
    constraints:
      - "Attached FAQ/CTA when on shared layout; complete meta + body before publish."
  directory: blog
  single_template: true
  field_mapping:
    title: title
    description: description
    published_at: published_at
    status: status
    category: category
    tags: tags
    lang: lang
    content: content
    _image: image
    _slug: slug
    _locale: locale
    _hreflangs: ''
    _updated_at: updated_at
    downloadable:
      source: downloadable
      default: null
    faq_entries:
      source: faq_entries
      default: null
    call_to_action:
      source: call_to_action
      default: null
    authors:
      source: authors
      default: null
  indexes:
    - status
    - category
    - authors
  url_pattern:
    en: /en/blog/:category/:slug
    es: /es/blog/:category/:slug
  layout:
    menu:
      top: main-navbar
      bottom: main-footer
  unique_fields:
    - slug
  preview:
    component: og_image_preview
    variant: default
    version: v1.0
    theme: dark
    widths:
      - 1200
    maxHeight: 630
    dirty_on_prop_change: false
    props:
      logo: brand.logo
      category: category
      title: title
      content: content
      author: brand.title
  editor:
    title:
      required: true
    description:
      required: true
    published_at:
      type: datetime
      description: >-
        Go-live date. Set automatically when the entry first goes live; edit to backdate. Saves to _common.yml; cannot
        clear.
      required: true
    category:
      type: select
      description: >-
        URL category slug (plain string). Used in /:category/:slug. Prefer an existing peer value; allow_custom_values
        permits new slugs when intentional.
      populate_options: true
      allow_custom_values: true
      required: true
    authors:
      type: relation
      source: authors
      value: slug
      label: name
      multiple: true
      required: true
      description: >-
        Authors entry slug(s). Store pointers only — Person fields live on the authors entry. First = primary. Saved on
        _common.yml.
    downloadable:
      type: pdf
      description: URL of a lead magnet downloadable that we want to include in the blog for lead nurturing
    content:
      type: markdown
      required: true
    faq_entries:
      type: json
      description: >-
        At least 5 items, this is really important for SEO/GEO purposes because it creates schema org for FAQ and LLMs
        pick it to include in its post-training.
      schema:
        type: array
        items:
          type: object
          required:
            - question
            - answer
          properties:
            question:
              type: string
            answer:
              type: string
          additionalProperties: false
      required: true
    call_to_action:
      type: json
      required: true
      description: >-
        Per-post CTA banner copy and lead settings for the shared blog cta_banner. Form field layout stays in the shared
        template (single.*.yml) except optional program default. Before setting conversion_name or tags, call
        explain_site topic component-behaviors. conversion_name must match tracking.conversion_events. tags is an
        optional CRM tag string from tracking.leads_expected_tags — if unsure or that list is empty, ask a human; never
        invent tags. Prefer omitting tags when the conversion event defaults suffice. program is an optional program
        bc_slug (hidden form default). success.message = inline thank-you; success.url (optional) redirects after submit
        when set.
      schema:
        type: object
        required:
          - title
          - subtitle
          - conversion_name
        properties:
          title:
            type: string
          subtitle:
            type: string
          conversion_name:
            type: string
            description: Must match a tracking.conversion_events name (see explain_site component-behaviors).
          tags:
            type: string
            description: >-
              Optional CRM tags (comma-separated). Each token must be in tracking.leads_expected_tags. Ask a human if
              unsure or the allowlist is empty — never invent.
          program:
            type: string
            description: Optional program bc_slug sent as a hidden form field default (e.g. full-stack).
          submit_label:
            type: string
          success:
            type: object
            description: >-
              Post-submit behavior. Prefer message (stay on page) or url (redirect). url is optional; when present,
              redirects the user after a successful submit.
            properties:
              message:
                type: string
                description: Inline thank-you when not redirecting.
              url:
                type: string
                description: Optional. When set, redirects the user after a successful submit.
            additionalProperties: false
        additionalProperties: false
  seo_monitoring:
    enabled: true
    require_cluster: true
authors:
  insights_intent: content_seo
  strategy:
    purpose: "Person entity pages for authorship and E-E-A-T signals."
    constraints:
      - "Stable topical knowsAbout labels; https profile URLs only."
  directory: authors
  single_template: true
  protected_slugs:
    - 4geeks-academy
  schema_org_requirements:
    - schema_type: Person
  field_mapping:
    name: name
    job_title: job_title
    bio: bio
    same_as: same_as
    works_for: works_for
    knows_about: knows_about
    _slug: slug
    _locale: locale
    _hreflangs: ''
    _updated_at: ''
    _image: image
    published_at: published_at
  indexes:
    - name
  url_pattern:
    en: /en/authors/:slug
    es: /es/autores/:slug
  layout:
    menu:
      top: main-navbar
      bottom: main-footer
  unique_fields:
    - slug
  editor:
    name:
      type: text
      required: true
      description: >-
        Schema.org Person.name (required). Canonical display name for bylines, author hubs, and JSON-LD. Prefer the
        public byline people recognize (e.g. "Ada Lovelace"), not a username. Keep stable across locales; translate only
        when the person uses a different public name. Used as {{ single.name }} and BlogPosting.author.name.
    job_title:
      type: text
      description: >-
        Schema.org Person.jobTitle. Short role/credential string (e.g. "Curriculum Lead", "Software Engineer"). One
        line; avoid marketing slogans. Emits as jobTitle on Person JSON-LD when set. Optional but helps E-E-A-T.
    bio:
      type: textarea
      description: >-
        Schema.org Person.description — author bio for the hub page and LD. Soft target ~50–100 words (~300–600 chars);
        OK up to ~150–200 words. Keep factual credentials (who you are, what you teach/write), not a full resume. Prefer
        a single tight sentence for LD consumers; do not paste HTML. Soft-warn if much longer — not a hard SEO cap.
        Distinct from page meta.description (SEO head / Meta tab). Template: {{ single.bio }}.
    same_as:
      type: tags
      allow_custom_values: true
      description: >-
        Schema.org Person.sameAs — absolute profile URLs that identify the same person (LinkedIn, X/Twitter, GitHub,
        company about page, Wikipedia). One URL per tag; https only; no tracking params. Strengthens entity matching for
        SEO/GEO. Do not put the author hub URL here (that is Person.url / @id from routing). Emits sameAs[].
    works_for:
      type: text
      description: >-
        Schema.org Person.worksFor — organization the person works for. Plain org name string is fine (e.g. "4Geeks
        Academy"); richer nested Organization markup is generated as { "@type": Organization, name }. Optional; use when
        affiliation is public. Emits worksFor on Person JSON-LD.
    knows_about:
      type: tags
      allow_custom_values: true
      description: >-
        Schema.org Person.knowsAbout — topics of expertise/interest (Text tags). Short topical labels (e.g.
        "full-stack", "machine-learning", "career-change"), not sentences. Suggests expertise; does not claim
        credentials.         Prefer stable topic language matching site categories when possible. Emits knowsAbout[] in
        Person JSON-LD. Thing/URL objects are not supported in this editor — use plain text topics only.
    _image:
      type: image
      cache_images: true
      description: >-
        Author portrait → reserved _image / {{ single.image }} (Person.image). Square headshot preferred; real photo of
        the person for E-E-A-T. Use Media Gallery (registry). Avoid logos here — logos belong on Organization, not
        Person.
    published_at:
      type: datetime
      description: >-
        Editorial go-live timestamp for the author hub (reserved published_at on _common.yml). Auto-stamped on first
        live create; editable to backdate. Not Schema.org Person — used for listings/sitemap freshness. Cannot clear to
        empty.
