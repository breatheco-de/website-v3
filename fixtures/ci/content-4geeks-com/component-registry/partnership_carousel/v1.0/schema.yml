name: Partnership Carousel
version: "1.0"
component: PartnershipCarousel
file: client/src/components/partnership_carousel/PartnershipCarousel.tsx
description: >-
  A dual-column carousel for showcasing partnerships. Left side displays a full image, right side shows title, subtitle,
  description, stats, institution logos, press references, and a CTA button. Navigation arrows appear below the
  carousel.
when_to_use: |
  Use when showcasing multiple institutional partnerships or collaborations, each with its own
  image, description, statistics, and supporting logos. Better than a static logo strip when
  each partnership deserves its own narrative and calls for a dedicated CTA. Best for
  partnerships or accreditations pages with 2–6 partner entries.
props:
  variant:
    type: string
    required: false
    options:
      - default
      - split-card
  vertical_cards:
    type: boolean
    required: false
  institutions_heading:
    type: string
    required: false
  references_heading:
    type: string
    required: false
  heading:
    type: string
    required: false
  subtitle:
    type: string
    required: false
  background:
    type: string
    required: false
  slides:
    type: array
    required: true
    items:
      image_id:
        type: string
        required: true
      object_fit:
        type: string
        required: false
        options:
          - cover
          - contain
          - fill
          - none
      object_position:
        type: string
        required: false
      title:
        type: string
        required: true
      subtitle:
        type: string
        required: false
      description:
        type: string
        required: false
      stats:
        type: array
        required: false
        items:
          value:
            type: string
            required: true
          label:
            type: string
            required: true
      institution_logos:
        type: array
        required: false
        items:
          image_id:
            type: string
            required: true
          alt:
            type: string
            required: false
          text:
            type: string
            required: false
          logo_height:
            type: string
            required: false
      press_references:
        type: array
        required: false
        items:
          text:
            type: string
            required: false
          url:
            type: string
            required: false
          source:
            type: string
            required: false
      cta:
        type: object
        required: false
        properties:
          text:
            type: string
            required: true
          url:
            type: string
            required: true
          variant:
            type: string
            required: true
            options:
              - primary
              - secondary
              - outline
          tracking:
            type: string
            required: false
            options:
              - none
              - add_to_cart
              - begin_checkout
          button_variant:
            type: string
            required: false
          text_color:
            type: string
            required: false
          icon:
            type: string
            required: false
          us_only:
            type: boolean
            required: false
  autoplay:
    type: boolean
    required: false
  autoplay_interval:
    type: number
    required: false
variants:
  default: {}
  split-card: {}
