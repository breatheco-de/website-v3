  reverse_on_mobile:
    type: boolean
    required: false
    description: Reverse column order on mobile devices
  heading_above_on_md:
    type: boolean
    required: false
    description: >-
      Whether the heading appears above both columns on tablet (md) screens. When true, heading is centered above
      columns on tablet. When false, heading stays within its column.
  gap:
    type: string
    required: false
    description: Gap between left and right columns (Tailwind gap value)
    example: "8"
  padding_left:
    type: string
    required: false
    description: Left padding for the section (Tailwind pl-* value, 0-96)
    example: "24"
  padding_right:
    type: string
    required: false
    description: Right padding for the section (Tailwind pr-* value, 0-96)
    example: "24"
