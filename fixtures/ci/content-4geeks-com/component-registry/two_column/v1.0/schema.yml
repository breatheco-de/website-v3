    description: Optional call-to-action button rendered below the two-column content
    example:
      text: Explore Financing Options
      url: /financing
      variant: primary
variants:
  benefitCards:
    content_shape:
      items:
        benefit_items:
          min: 4
          max: 4
          typical: 4
      text:
        title:
          min: 25
          max: 25
          typical: 25
      image: unused
      icon: required
      sample_pages: 1
      measured_at: "2026-10-02"
    best_for: Landing pages explaining 4 key benefits using icon + short title per card in a two-column layout.
    avoid_when: Pages needing images, videos, more or less than 4 items, or content without clear benefit-style cards.
    metadata_status: draft
  default:
    content_shape:
      items:
        proportions:
          min: 2
          max: 2
          typical: 2
      image: unused
      icon: unused
      sample_pages: 61
      measured_at: "2026-10-02"
    best_for: Side-by-side feature explanations or eligibility criteria with exactly 2 columns of text, bullets, icons and CTAs.
    avoid_when: Pages needing images, videos, more or less than 2 columns, or single-column long-form content.
    metadata_status: draft
