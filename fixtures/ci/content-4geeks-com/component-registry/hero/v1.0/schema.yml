name: Hero Section
version: "1.0"
component: Hero
file: client/src/components/hero/Hero.tsx
description: Main banner at the top of the page with title, subtitle, and call-to-action. Supports multiple layout variants.
when_to_use: |
  Every page should start with a hero section. Choose the variant that best fits your content:
  - singleColumn: Centered content with optional trust bar and award badges (best for program pages)
  - showcase: 3-column layout with images on sides (best for landing pages)
  - productShowcase: Text on left with video on right (best for product/service introductions)
  - simpleTwoColumn: Image on left, text with CTAs on right (best for promotions, announcements)
behaviors:
  ecommerce:
    role: funnel
    events:
      - view_item
      - add_to_cart
    notes: >-
      Course variant only: fires view_item when the page has a purchasable product. Field-editor
      course:signup_card.cta_button binds cta.tracking (add_to_cart for payment-component). Other hero variants do not
      bind cta-tracking.
  conversion:
    via: form-settings
    notes: >-
      Forms tab on course (signup_card.form), productShowcase, ApplyFormProductShowcase, and exercise only. CTA-only
      variants (orbit, credibility, singleColumn, etc.) have no form-settings binding.
  schema_org:
    requires:
      - companion_type: schema_org
        schema_type: Course
        when_variant: course
    notes: >-
      Course variant only: requires ≥1 merged schema_org section with schema_type Course. Hero does not emit Course
      JSON-LD itself.
image_sizes:
  singleColumn.image.src: "(min-width: 768px) 800px, 100vw"
  singleColumn.trust_bar.avatars: 32px
  credibility.pills[].logos[].image_id: "(min-width: 768px) 45px, 60px"
  course.students_enrolled.avatars[].src: 40px
  course.tutors[].image: 45px
  simpleTwoColumn.image.src: 300px
variants:
  ApplyFormProductShowcase: {}
  course:
    description: Two column layout with content on left (title, bullet points, tutors) and media + signup card on right
    best_for: Course landing pages, self-paced program pages
  credibility:
    description: >-
      Two column hero with large rich-text title on the left and a vertical stack of credibility pills on the right,
      plus an optional muted watermark marquee at the bottom
    best_for: Homepage hero sections, trust-building landing pages, program overview pages
  exercise:
    description: >-
      Two-column layout with badge, title, description, and "This exercise includes" card on the left; an enrollment
      form card on the right; and a stats bar that overlaps the bottom of the hero.
    best_for: Interactive exercise landing pages
  orbit:
    description: >-
      Two-column hero with eyebrow, large title and CTAs on the left, and an animated multi-ring orbit diagram on the
      right. Orbit badges are categorized as highlight (primary color) or default (muted). Fully responsive — collapses
      to single column on mobile.
    best_for: >-
      Homepage hero sections, AI/tech product pages, program overview pages where the concept of convergence or
      interconnection is key
  productShowcase:
    description: Two column layout with brand mark, text on left and video on right
    best_for: Product/service introductions, feature pages
  singleColumn:
    description: Centered single column with badge, title, subtitle, CTAs, trust bar, and award badges
    best_for: Program pages, course pages
  showcase:
    description: 3-column layout with images on left/right, centered content with trust bar
    best_for: Landing pages, marketing pages
  simpleTwoColumn:
    description: Two column layout with image on left and title, subtitle, CTA buttons on right
    best_for: Guarantee pages, feature announcements, promotional sections
  simpleStacked: {}
  twoColumn:
    description: Two-column hero with image or media on one side and text/CTAs on the other (legacy variant)
    best_for: General landing pages, legacy pages using the older two-column hero layout
