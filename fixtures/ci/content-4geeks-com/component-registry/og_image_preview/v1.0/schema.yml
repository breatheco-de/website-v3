name: OG Image Preview
version: "1.0"
component: OgImagePreview
file: client/src/components/og_image_preview/variants/OgImagePreviewDefault.tsx
description: |
  Fixed 1200×630 screenshot canvas for social/OG thumbs (Entry Preview), not a normal page section.
  Renders logo, category, title, author, and auto-calculated reading time on a dark brand gradient.
when_to_use: |
  Use as the content-type Entry Preview target so missing reserved `image` fields can be
  generated by screenshotting this card. Do not place it in page YAML as a marketing section.
  Map title, category (string or string[]), author, content (article body), and logo.
  Reading time is derived from `content` (~200 wpm), not mapped separately.
  Do not map the reserved `image` field. Advanced: client/src/components/EntryPreviewAdmin.tsx,
  shared/entry-preview-props.ts, client/src/lib/entryPreviewCapture.ts.
props:
  variant:
    type: string
    required: false
    options:
      - default
  logo:
    type: string
    required: false
    description: Image registry ID for the brand logo (defaults to the site 4Geeks wordmark)
  category:
    type: string
    required: false
    description: >
      Category label(s) above the title as badges. Accepts a string or string[] (e.g. mapped from tags); each item is
      shown as an uppercase badge.
  title:
    type: string
    required: true
    description: Main headline for the OG card
  author:
    type: string
    required: false
    description: Author name for the meta line
  content:
    type: string
    required: false
    description: >
      Article body field used only to calculate reading time (~200 wpm, same as the article component). The body is not
      rendered on the card — you will see "N min read" in the meta line.
  reading_time:
    type: string
    required: false
variants:
  default: {}
