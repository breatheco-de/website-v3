name: Apply Form Section
version: "1.0"
component: ApplyFormSection
file: client/src/components/ApplyFormSection.tsx
description: >-
  Application form with hero section, multi-field form, and next steps explanation. Designed for program applications
  with country-based phone input and geo-located defaults.
when_to_use: |
  Use this component for program application pages. It includes:
  - Hero section with title, subtitle, and optional note
  - Program and location selection dropdowns (populated from _common.yml)
  - Contact information fields with phone input featuring country flags
  - Marketing and SMS consent checkboxes (SMS only shown for US users)
  - Next steps section explaining what happens after submission
behaviors:
  conversion:
    via: form-settings
    notes: Lead/form conversion settings via Forms tab.
props:
  hero:
    type: object
    required: true
    properties:
      title:
        type: string
        required: true
        description: Main headline for the apply page
        example: Your Future in Tech Starts Here
      subtitle:
        type: string
        required: true
        description: Supporting text explaining the application process
        example: You're one step closer to your new career in tech
      note:
        type: string
        required: false
        description: Additional note displayed below subtitle (often reassuring text)
        example: (And don't worry — you won't be committing to anything yet)
    description: Hero section displayed above the form
  webhook:
    type: object
    required: false
    properties:
      url:
        type: string
        required: true
        description: Destination URL to POST/GET the conversion payload
        example: https://hooks.zapier.com/hooks/catch/xxxxx/yyyyy/
      method:
        type: string
        required: true
        description: HTTP method (default POST)
        example: POST
    description: >-
      Form-level webhook — highest priority in the three-level chain (form > per-event > global). When set, this webhook
      is always used for this apply form regardless of tracking settings.
