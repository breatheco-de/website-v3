name: Two Column Accordion Card
version: "1.0"
component: TwoColumnAccordionCard
file: client/src/components/two_column_accordion_card/TwoColumnAccordionCard.tsx
description: >-
  A card-based section with two columns - one side has a title, description, and expandable accordion items, the other
  side displays an image. Great for detailed feature explanations or FAQ-style content.
when_to_use: |
  Use when you need to pair visual media (image or video) with an expandable list of features,
  FAQs, or step-by-step details. The accordion keeps the section compact while letting users
  drill into specifics. Better than a plain two_column when the text content is long enough to
  benefit from progressive disclosure. Use the image_background variant for a warmer, branded feel.
image_sizes:
  image_background.image: "(min-width: 768px) 500px, 100vw"
props:
  variant:
    type: string
    required: false
    options:
      - default
      - image_background
  title:
    type: string
    required: false
  description:
    type: string
    required: false
  bullets:
    type: array
    required: false
    items:
      heading:
        type: string
        required: true
      text:
        type: string
        required: true
  footer:
    type: string
    required: false
  image:
    type: string
    required: false
  image_alt:
    type: string
    required: false
  image_object_fit:
    type: string
    required: false
    options:
      - cover
      - contain
      - fill
      - none
      - scale-down
  image_object_position:
    type: string
    required: false
  video:
    type: object
    required: false
    properties:
      url:
        type: string
        required: false
      ratio:
        type: string
        required: false
      mobile_ratio:
        type: string
        required: false
      width:
        type: string
        required: false
      muted:
        type: boolean
        required: false
      autoplay:
        type: boolean
        required: false
      loop:
        type: boolean
        required: false
      preview_image_url:
        type: string
        required: false
      with_shadow_border:
        type: boolean
        required: false
      open_modal_on_click:
        type: boolean
        required: false
      show_controls_on_autoplay:
        type: boolean
        required: false
      overlay_on_muted:
        type: object
        required: false
        properties:
          title:
            type: string
            required: false
          subtitle:
            type: string
            required: false
          icon:
            type: string
            required: false
          restart_video_on_click:
            type: boolean
            required: false
  reverse:
    type: boolean
    required: false
variants:
  default:
    best_for: >-
      Pages needing to explain 3-6 detailed features or FAQs alongside a supporting image, where content depth benefits
      from expandable accordions while keeping the layout compact.
    avoid_when: >-
      Pages with short text, high image counts, video content, or when users need to see all details at once without
      clicking.
    metadata_status: draft
  image_background:
    content_shape:
      items:
        bullets:
          min: 3
          max: 4
          typical: 4
      text:
        title:
          min: 20
          max: 62
          typical: 55
        description:
          min: 84
          max: 271
          typical: 119
      image: required
      icon: unused
      sample_pages: 41
      measured_at: "2026-10-02"
    best_for: >-
      Best for location or program pages with 3-4 detailed FAQ or feature items, a 55-character title, ~120-character
      description, and a full-bleed branded background image or video.
    avoid_when: >-
      Avoid when you have fewer than 3 accordion items, need icons instead of images, or the page goal is a short
      landing with minimal text content.
    metadata_status: draft
