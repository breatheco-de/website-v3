name: Lead Form
version: "1.0"
component: LeadForm
file: client/src/components/LeadForm.tsx
description: >-
  Lead capture form with configurable fields, auto-detection from session, and consent checkboxes. Submits to marketing
  API.
when_to_use: |
  Use this component when you need to collect user information for lead generation:
  - Program signup pages
  - Landing pages with contact forms
  - Request information sections
  - Newsletter signups with extended data collection
behaviors:
  conversion:
    via: form-settings
    notes: Fires conversion_name on submit; Forms tab edits defaults.
props:
  variant:
    type: string
    required: false
    options:
      - stacked
      - inline
    description: Layout variant to use
    example: stacked
  conversion_name:
    type: string
    required: false
  ecommerce_product_field:
    type: string
    required: false
  title:
    type: string
    required: false
  subtitle:
    type: string
    required: false
    description: Supporting text above the fields (also overridable per signup phase via messages)
    example: Get free information about our programs
  submit_label:
    type: string
    required: false
    description: Text for the submit button
    example: Request Info
  tags:
    type: string
    required: false
    description: Tags to associate with the lead
    example: website-lead,landing-page
  automations:
    type: string
    required: false
    description: Automation level for the lead
    example: strong
  webhook:
    type: object
    required: false
    properties:
      url:
        type: string
        required: true
        description: >-
          Destination URL to POST/GET the conversion payload. May include {{ entry.* }} / {{ visitor.* }} templates.
        example: https://hooks.zapier.com/hooks/catch/xxxxx/yyyyy/
      method:
        type: string
        required: false
        options:
          - POST
          - GET
        description: HTTP method (default POST)
        example: POST
      headers:
        type: object
        required: false
        description: >-
          Outbound request headers (e.g. Authorization). May include {{ visitor.token }} / {{ entry.* }} on forms.
      fail_silently:
        type: boolean
        required: false
        description: >-
          When true, respond success before upstream finishes (fire-and-forget). Omit/false = await upstream;
          non-2xx shows a form error.
    description: >-
      Form-level webhook — highest priority in the three-level chain (form > per-event > global). When set, this webhook
      is always used for this form regardless of tracking settings. Requires a non-empty url.
  fields:
    type: object
    required: false
    description: >-
      Known UI slots (email, phone, program, …) plus optional extra keys for hidden
      payload/analytics defaults (e.g. event_id with visible: false and default:
      "{{ entry.id }}"). Extra keys are not rendered until a future generic field loop;
      their resolved defaults still ship on lead body and GTM (string, number, or
      boolean after resolveDeep). Wire keeps hardcoded BC fields and merges any other
      scalars through.
    properties:
      email:
        type: object
        required: false
        properties:
          visible:
            type: boolean
            required: false
          required:
            type: boolean
            required: false
          default:
            type: string
            required: false
            description: Use 'auto' for auto-detection or a static value
          default_country:
            type: string
            required: false
          helper_text:
            type: string
            required: false
          placeholder:
            type: string
            required: false
          show_label:
            type: boolean
            required: false
          label:
            type: string
            required: false
          slugs:
            type: array
            required: false
            items:
              type:
                type: string
                required: true
          source:
            type: object
            required: false
            properties:
              content_type:
                type: string
                required: false
              database:
                type: string
                required: false
              related_field:
                type: string
                required: false
              query:
                type: string
                required: false
              value_path:
                type: string
                required: true
              label_path:
                type: string
                required: true
          component_renderer:
            type: string
            required: false
            options:
              - text
              - phone
              - textarea
              - select
              - cards
              - simple-list
              - grouped-list
          options:
            type: array
            required: false
            items:
              value:
                type: string
                required: true
