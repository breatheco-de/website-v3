    description: Configuration for each form field. Each field can have visible, required, and default properties.
  success:
    type: object
    required: false
    properties:
      url:
        type: string
        required: false
        description: Redirect URL after success
        example: /thank-you
      message:
        type: string
        required: false
        description: Success message to display (if no url)
        example: Thanks! We'll contact you within 24 hours.
      reload_entry_fields:
        type: boolean
        required: false
    description: What happens after successful submission
  form_overrides:
    type: array
    required: false
    items:
      conditions:
        type: array
        required: true
        items:
          field_property_slug:
            type: string
            required: false
          form_field_slug:
            type: string
            required: false
          entry_field_slug:
            type: string
            required: false
          match_method:
            type: string
            required: false
            options:
              - equals
              - contains
          value:
            type: string
            required: true
      conversion_name:
        type: string
        required: false
      ecommerce_product_field:
        type: string
        required: false
      success:
        type: object
        required: false
        properties:
          url:
            type: string
            required: false
          message:
            type: string
            required: false
          reload_entry_fields:
            type: boolean
            required: false
      tags:
        type: string
        required: false
      automations:
        type: string
        required: false
      webhook:
        type: object
        required: false
        properties:
          url:
            type: string
            required: true
          method:
            type: string
            required: false
            options:
              - POST
              - GET
          headers:
            type: object
            required: false
          fail_silently:
            type: boolean
            required: false
      messages:
        type: object
        required: false
    description: >-
      Continuous form_overrides: the first entry whose conditions all match (AND) overlays this form for both UI copy
      and submit (messages, webhook, success, tags, conversion_name). Partial message/success/webhook objects are
      deep-merged onto the form root. No match → root form props. Prefer field_property_slug templates
      ({{ form.* }} / {{ entry.* }} / {{ visitor.* }}); legacy form_field_slug / entry_field_slug still work.
      Condition operands resolve in LeadForm at match time. match_method equals (default) or contains.
  messages:
    type: object
    required: false
    description: >-
      Phase copy for signup forms (guest, login, incomplete, ready). Routes may override individual phases/fields via
      deep merge.
