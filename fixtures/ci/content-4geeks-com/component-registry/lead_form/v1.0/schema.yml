        type: object
        required: false
        properties:
          visible:
            type: boolean
            required: false
          required:
            type: boolean
            required: false
          default:
            type: string
            required: false
            description: Use 'auto' for auto-detection or a static value
          default_country:
            type: string
            required: false
          helper_text:
            type: string
            required: false
          placeholder:
            type: string
            required: false
          show_label:
            type: boolean
            required: false
          label:
            type: string
            required: false
          slugs:
            type: array
            required: false
            items:
              type:
                type: string
                required: true
          source:
            type: object
            required: false
            properties:
              content_type:
                type: string
                required: false
              database:
                type: string
                required: false
              related_field:
                type: string
                required: false
              query:
                type: string
                required: false
              value_path:
                type: string
                required: true
              label_path:
                type: string
                required: true
          component_renderer:
            type: string
            required: false
            options:
              - text
              - phone
              - textarea
              - select
              - cards
              - simple-list
              - grouped-list
          options:
            type: array
            required: false
            items:
              value:
                type: string
                required: true
