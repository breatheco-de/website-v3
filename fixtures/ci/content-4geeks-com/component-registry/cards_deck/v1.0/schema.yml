name: Cards Deck
version: "1.0"
component: CardsDeck
file: client/src/components/cards-deck/CardsDeck.tsx
description: A row of 3 cards, each with optional video, brand image, author name, title, and description.
when_to_use: |
  Use when you want to feature exactly 3 items side-by-side — such as instructor profiles,
  program highlights, or media features. Each card supports a video embed or brand image plus
  author credit. Best for mid-page trust sections or course instructor showcases.
props:
  variant:
    type: string
    required: false
    options:
      - default
  heading:
    type: string
    required: false
  subtitle:
    type: string
    required: false
  cards:
    type: array
    required: true
    items:
      video:
        type: object
        required: false
        properties:
          url:
            type: string
            required: false
          ratio:
            type: string
            required: false
          mobile_ratio:
            type: string
            required: false
          width:
            type: string
            required: false
          muted:
            type: boolean
            required: false
          autoplay:
            type: boolean
            required: false
          loop:
            type: boolean
            required: false
          preview_image_url:
            type: string
            required: false
          with_shadow_border:
            type: boolean
            required: false
          open_modal_on_click:
            type: boolean
            required: false
          show_controls_on_autoplay:
            type: boolean
            required: false
          overlay_on_muted:
            type: object
            required: false
            properties:
              title:
                type: string
                required: false
              subtitle:
                type: string
                required: false
              icon:
                type: string
                required: false
              restart_video_on_click:
                type: boolean
                required: false
      image:
        type: string
        required: false
      brand_image:
        type: string
        required: false
      author_name:
        type: string
        required: false
      title:
        type: string
        required: true
      description:
        type: string
        required: true
variants:
  default:
    content_shape:
      items:
        cards:
          min: 3
          max: 3
          typical: 3
          limit:
            min: 1
            max: 6
      text:
        heading:
          min: 34
          max: 44
          typical: 37
        subtitle:
          min: 58
          max: 202
          typical: 155
      image: required
      icon: unused
      sample_pages: 13
      measured_at: "2026-10-02"
    best_for: >-
      Feature exactly 3 instructor profiles, program highlights or media items side-by-side on landing pages, each with
      image or video, author/brand, title and description.
    avoid_when: Avoid when you need more or fewer than 3 items, lack images/videos, or require icons instead of media.
    metadata_status: draft
