name: Modal Section
version: "1.0"
component: Modal
file: client/src/components/modal/Modal.tsx
description: >-
  Popup overlay opened when the URL hash matches this section's section_id (e.g. CTA url: "#apply-modal"). Not an inline
  page block. Agents: explain_site topic sections.
when_to_use: >-
  Lead forms or short content that should open on click from a CTA/link instead of navigating away. Always set
  section_id; wire buttons with url: "#that-id". Agents: explain_site topic sections.
layout:
  flow: out
behaviors:
  conversion:
    via: form-settings
    notes: Lead/form conversion settings via Forms tab (default variant). twoColumn is content-only.
image_sizes:
  left.image: 480px
variants:
  default:
    description: Simple heading + optional lead form overlay
    best_for: Apply / contact popups opened via
    content_shape:
      text:
        heading:
          min: 14
          max: 39
          typical: 23
        description:
          min: 66
          max: 163
          typical: 108
      image: unused
      icon: unused
      sample_pages: 22
      measured_at: "2026-10-02"
    avoid_when: >-
      Pages needing inline content, media, images, icons, or complex multi-section layouts that cannot be triggered via
      URL hash.
    metadata_status: draft
  twoColumn:
    description: two_column-style overlay — image + rich text + bullets + CTA buttons
    best_for: Workshop RSVP success and similar confirmation overlays
    content_shape:
      items:
        proportions:
          min: 2
          max: 2
          typical: 2
      image: unused
      icon: unused
      sample_pages: 1
      measured_at: "2026-10-02"
    avoid_when: >-
      Pages needing more or less than 2 columns, inline content, heavy image galleries, or content that should stay on
      the main page flow.
    metadata_status: draft
