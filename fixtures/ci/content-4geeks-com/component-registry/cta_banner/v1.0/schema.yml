version: "1.0"
component: CtaBanner
file: client/src/components/cta_banner/CtaBanner.tsx
description: ""
when_to_use: ""
behaviors:
  conversion:
    via: form-settings
    notes: Lead/form conversion settings via Forms tab.
variants:
  default:
    content_shape:
      text:
        title:
          min: 26
          max: 44
          typical: 41
        subtitle:
          min: 88
          max: 147
          typical: 111
      image: unused
      icon: unused
      sample_pages: 3
      measured_at: "2026-10-02"
    best_for: >-
      Landing and marketing pages needing a prominent headline (26-44 chars) with supporting subtitle (88-147 chars) to
      drive form conversions.
    avoid_when: >-
      Pages with many items, image-heavy content, or when a compact strip, resource showcase, or promotional banner
      variant would be more suitable.
    metadata_status: draft
  form:
    content_shape:
      text:
        title:
          min: 10
          max: 90
          typical: 42
        subtitle:
          min: 43
          max: 294
          typical: 67
      image: unused
      icon: unused
      sample_pages: 139
      measured_at: "2026-10-02"
    best_for: >-
      Landing and location pages with a short title (under 50 chars) and longer subtitle that want to capture leads via
      an inline form.
    avoid_when: >-
      Blog posts, program pages, or any content-heavy pages where a simple button CTA would be more appropriate than a
      form.
    metadata_status: draft
  promotion:
    best_for: >-
      Promotional CTAs on marketing or product pages with a strong headline, short subtitle, and 1-2 action buttons to
      drive conversions.
    avoid_when: Pages needing simple links, high item counts, heavy media, or subtle non-promotional messaging.
    metadata_status: draft
  resourceShowcase:
    content_shape:
      items:
        benefits:
          min: 2
          max: 3
          typical: 2
      text:
        eyebrow:
          min: 13
          max: 27
          typical: 13
        title:
          min: 52
          max: 134
          typical: 63
        subtitle:
          min: 54
          max: 151
          typical: 115
      image: unused
      icon: unused
      sample_pages: 14
      measured_at: "2026-10-02"
    best_for: Blog pages promoting downloadable resources with 2-3 benefits, a PDF preview, and an embedded lead form.
    avoid_when: Pages without a clear resource download or when no lead form or preview content is available.
    metadata_status: draft
  strip:
    content_shape:
      items:
        cta_buttons:
          min: 1
          max: 1
          typical: 1
      image: unused
      icon: required
      sample_pages: 1
      measured_at: "2026-10-02"
    best_for: >-
      Landing pages needing a compact horizontal CTA strip with one icon, rich text, and exactly one button to drive a
      single action.
    avoid_when: Pages requiring multiple CTAs, hero visuals, large images, or more than one button.
    metadata_status: draft
