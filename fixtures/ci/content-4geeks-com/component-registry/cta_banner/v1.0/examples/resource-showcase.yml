variant: resourceShowcase
yaml: |
  - type: cta_banner
    variant: resourceShowcase
    maxWidth:
      desktop: 6xl
    eyebrow: "Guía descargable"
    title: "Arma tu propio flujo de captación con <span style='color: hsl(var(--primary))'>IA</span>."
