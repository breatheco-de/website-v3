name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (advisory)
        continue-on-error: true
        run: npm run check

      # site_* / sites.yml are gitignored. Seed enough for shared/schema + CT tests.
      - name: Install CI content fixture
        run: |
          cp fixtures/ci/sites.fixture.yml sites.yml
          rm -rf site_4geeks-com
          cp -a fixtures/ci/content-4geeks-com site_4geeks-com

      - name: Unit tests
        # Single worker avoids SQLITE_BUSY on shared db-cache.sqlite across Vitest pools.
        run: npx vitest run --maxWorkers=1
